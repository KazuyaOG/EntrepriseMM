name: Build Windows app (.exe)

# Produit l'application Windows : un installateur (.exe) et une version portable (.exe).
# Se déclenche manuellement (Actions → Run workflow) ou à la publication d'un tag v1.0.0.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Compiler pour Windows
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'interface web
        run: npm run build

      - name: Produire les exécutables Windows
        # Pas de certificat de signature dans ce dépôt : on désactive la recherche
        # automatique de certificat pour éviter un échec de compilation.
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier que les exécutables existent
        shell: pwsh
        run: |
          $files = Get-ChildItem release/*.exe
          if (-not $files) { throw "Aucun .exe n'a été produit." }
          $files | ForEach-Object { "{0} ({1:N1} Mo)" -f $_.Name, ($_.Length / 1MB) }

      - name: Conserver les exécutables (téléchargeables dans l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-MM-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Joindre les exécutables à la publication (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
